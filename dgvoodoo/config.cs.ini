; Black Mirror – nastavení doplňků (DDraw.dll + bm_core.dll)

[Movies]
; 1 = CGI filmy roztažené na celou šířku obrazovky (širokoúhlé filmy bez černých pruhů po stranách)
; 0 = vypnuto, filmy zůstanou v rámci obrazu 4:3 jako v původní hře
FullWidth=1

[Cursor]
; Kolikrát za sekundu se může překreslit kurzor (logika hry zůstává na 25 krocích za sekundu).
; 60 = plynulý kurzor na 60Hz monitoru, 0 = vypnuto (kurzor jako v původní hře, 25x za sekundu)
Fps=60
; Citlivost myši: 0.1 (nejpomalejší) až 1.0 (rychlost jako v původní hře), výchozí 0.7
Sensitivity=0.7

[Controls]
; 1 = zapnuto, 0 = vypnuto
; ESC ve hře otevře nabídku (jako klik na ozubená kolečka vpravo nahoře); ESC v nabídce vrátí do hry
EscapeMenu=1
; mezerník ukáže aktivní místa ve scéně na 2 s jako tabulátor (držený stále): východy ikonou dveří, ostatní kroužkem;
; kurzor je nad nimi červený (jako u tabulátoru)
SpaceHotspots=1
; během rozhovoru/animace: ESC přeskočí repliku i animace a hudbu až po další repliku (držený přeskakuje
; dál, dokud hráč nezíská kontrolu), mezerník přeskočí jen jednu repliku, ostatní klávesy nepřeskakují nic
HoldToSkip=1
; F5 = obrazovka Uložit hru, F8 = Nahrát hru (ESC z nich vrátí rovnou do hry)
SaveLoadKeys=1
; kolečko myši listuje předměty inventáře na kurzoru (dolů = další, nahoru = předchozí)
WheelInventory=1
; dvojklik ve scéně: postava se objeví v cíli bez animace chůze (i u předmětu a východu)
DoubleClickWalk=1

[Video]
; vyhlazení hran ještě před zvětšením obrazu 800×600: 1 = jen postavy, 2 = celá plocha scény, 0 = vypnuto
; (nabídky, titulky a texty se nevyhlazují nikdy)
; (zvětšovací filtr je v dgVoodoo.conf: Resampling = lanczos-3, měkčí bicubic nebo bilinear)
Smoothing=1
; práh hrany v % jasu okolí (vyšší = méně vyhlazených hran, textury zůstanou ostřejší)
SmoothingThreshold=25

[Settings]
; 1 = titulky, hlasitost řeči, zvuku a hudby a korekce gama platí bez ohledu na uloženou hru
; (hodnoty změněné v Nastavení se zapíší do sekce [Remembered] níže)
Remember=1

; Změny platí po restartu hry.
