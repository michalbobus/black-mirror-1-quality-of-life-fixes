; Black Mirror – nastavenia doplnkov (DDraw.dll + bm_core.dll)

[Movies]
; 1 = CGI filmy roztiahnuté na celú šírku obrazovky (širokouhlé filmy bez čiernych pásov po bokoch)
; 0 = vypnuté, filmy ostanú v rámci obrazu 4:3 ako v pôvodnej hre
FullWidth=1

[Cursor]
; Režim kurzora:
;   hardware = najplynulejší (hardvérový kurzor) – hýbe sa pri každom pohybe myši nezávisle od snímok hry
;   smooth   = plynulý – hra prekresľuje kurzor až Fps-krát za sekundu (nižšie)
;   original = pôvodný – ako v pôvodnej hre (25x za sekundu)
Mode=hardware
; Koľkokrát za sekundu sa prekreslí kurzor v režime smooth (logika hry ostáva na 25 krokoch/s)
Fps=60
; Citlivosť myši: 0.1 (najpomalšie) až 1.0 (rýchlosť ako v pôvodnej hre)
; pre hardvérový kurzor (Mode=hardware) sa odporúča 0.5, pre ostatné režimy (smooth, original) 0.7
Sensitivity=0.5

[Controls]
; 1 = zapnuté, 0 = vypnuté
; ESC v hre otvorí ponuku (ako klik na ozubené kolieska vpravo hore); ESC v ponuke vráti do hry
EscapeMenu=1
; medzerník ukáže aktívne miesta v scéne na 2 s ako tabulátor (držaný stále): východy ikonou dverí, ostatné krúžkom;
; kurzor je nad nimi červený (ako pri tabulátore)
SpaceHotspots=1
; počas rozhovoru/animácie: ESC preskočí repliku aj animácie a hudbu až po ďalšiu repliku (podržaný preskakuje
; ďalej, kým hráč nedostane kontrolu), medzerník preskočí len jednu repliku, ostatné klávesy nepreskakujú nič
HoldToSkip=1
; F5 = obrazovka Uložit hru, F8 = Nahrát hru (ESC z nich vráti rovno do hry)
SaveLoadKeys=1
; Ctrl+S = rýchle uloženie, Ctrl+L = rýchle načítanie (aj z hlavnej ponuky); hláška dole na 2 s
QuickSaveKeys=1
; číslo pozície pre rýchle uloženie (1-98, v zozname pozícií na konci)
QuickSaveSlot=98
; koliesko myši listuje predmetmi inventára na kurzore (dole = ďalší, hore = predchádzajúci)
WheelInventory=1
; dvojklik v scéne: postava sa objaví v cieli bez animácie chôdze (aj pri predmete a východe)
DoubleClickWalk=1

[Video]
; vyhladenie hrán ešte pred zväčšením obrazu 800×600: 1 = len postavy, 2 = celá plocha scény, 0 = vypnuté
; (ponuky, titulky a texty sa nevyhladzujú nikdy)
; (zväčšovací filter je v dgVoodoo.conf: Resampling = lanczos-3, mäkšie bicubic alebo bilinear)
Smoothing=1
; prah hrany v % jasu okolia (vyššie = menej vyhladených hrán, textúry ostanú ostrejšie)
SmoothingThreshold=25
; obrazovka Uložiť/Nahrať hru: názvy pozícií bez čierneho obdĺžnika (ako bodky okolo)
SaveNamesTransparent=1

[Settings]
; 1 = titulky, hlasitosť reči, zvuku a hudby a gama korekcia platia bez ohľadu na uloženú hru
; (hodnoty zmenené v Nastaveniach sa zapíšu do sekcie [Remembered] nižšie)
Remember=1

; Zmeny platia po reštarte hry.
