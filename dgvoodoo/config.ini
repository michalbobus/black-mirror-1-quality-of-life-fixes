; Black Mirror – nastavenia doplnku DDraw.dll

[Movies]
; 1 = CGI filmy roztiahnuté na celú šírku obrazovky (širokouhlé filmy bez čiernych pásov po bokoch)
; 0 = vypnuté, filmy ostanú v rámci obrazu 4:3 ako v pôvodnej hre
FullWidth=1

[Cursor]
; Koľkokrát za sekundu sa môže prekresliť kurzor (logika hry ostáva na 25 tikoch/s).
; 60 = plynulý kurzor pri 60 Hz monitore, 0 = vypnuté (kurzor ako v pôvodnej hre, 25x/s)
Fps=60

