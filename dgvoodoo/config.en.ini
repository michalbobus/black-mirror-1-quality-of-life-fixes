; Black Mirror - plugin settings (DDraw.dll + bm_core.dll)

[Movies]
; 1 = CGI movies stretched to the full screen width (widescreen movies without black bars on the sides)
; 0 = off, movies stay inside the 4:3 picture as in the original game
FullWidth=1

[Cursor]
; Cursor mode:
;   hardware = smoothest (hardware cursor) – moves with every mouse movement independently of the game's frames
;   smooth   = smooth – the game redraws the cursor up to Fps times per second (below)
;   original = original – as in the original game (25 times per second)
Mode=hardware
; How many times per second the cursor is redrawn in smooth mode (the game logic stays at 25 steps per second)
Fps=60
; Mouse sensitivity: 0.1 (slowest) to 1.0 (original game speed)
; 0.5 is recommended for the hardware cursor (Mode=hardware), 0.7 for the other modes (smooth, original)
Sensitivity=0.5

[Controls]
; 1 = on, 0 = off
; ESC in the game opens the menu (like clicking the cogwheels in the top right corner); ESC in the menu returns to the game
EscapeMenu=1
; Space shows the hotspots in the scene for 2 seconds like Tab (permanently while held): exits with a door icon, others with a ring;
; the cursor is red over them (like with Tab)
SpaceHotspots=1
; during dialogue/animations: ESC skips the line plus animations and music up to the next line (held: keeps skipping
; until you are in control again), Space skips just one line, other keys skip nothing
HoldToSkip=1
; F5 = Save game screen (Uložit hru), F8 = Load game screen (Nahrát hru); ESC returns straight to the game
SaveLoadKeys=1
; Ctrl+S = quick save, Ctrl+L = quick load (also from the main menu); message at the bottom for 2 s
QuickSaveKeys=1
; save slot used for the quick save (1-98, at the end of the save list)
QuickSaveSlot=98
; mouse wheel cycles the inventory items on the cursor (down = next, up = previous)
WheelInventory=1
; double-click in the scene: the character appears at the target without the walking animation (objects and exits too)
DoubleClickWalk=1

[Video]
; edge smoothing before the 800x600 picture is upscaled: 1 = characters only, 2 = whole scene area, 0 = off
; (menus, subtitles and texts are never smoothed)
; (the upscaling filter is set in dgVoodoo.conf: Resampling = lanczos-3, softer bicubic or bilinear)
Smoothing=1
; edge threshold in % of the surrounding brightness (higher = fewer edges smoothed, textures stay sharper)
SmoothingThreshold=25
; Save/Load game screen: save names without the black rectangle (like the dots around them)
SaveNamesTransparent=1

[Settings]
; 1 = subtitles, speech, sound and music volume and gamma stay as set, regardless of the loaded saved game
; (values changed in the game's options are written to the [Remembered] section below)
Remember=1

; Changes take effect after restarting the game.
